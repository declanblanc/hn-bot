name: Post top HN stories

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Monday of the week to post (YYYY-MM-DD). Defaults to last week in UTC.'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm start
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          STORY_COUNT: ${{ vars.STORY_COUNT }}
          WEEK_START: ${{ inputs.week_start }}
